[package]
name = "tuynuk"
version = "0.1.0"
edition = "2021"
authors = ["Uktamjon Komilov <uktamforjob@gmail.com>"]

[dependencies]
clap = {version = "4.5.39", features = ["derive"]}
http-body-util = "0.1.3"
hyper ={ version = "1.6.0", features = ["full"]}
hyper-util = "0.1.14"
reqwest = "0.12.19"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = {version = "1.45.1", features = ["full"]}

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[[bin]]
name = "port-scanner"
path = "src/port_scanner.rs"

[[bin]]
name = "proxy"
path = "src/main.rs"